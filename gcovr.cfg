# gcovr configuration, picked up by `ninja coverage` (meson passes --root here).
#
# Bitwuzla's hot bit-vector code is executed more than 2^32 times over a full
# test-suite run. gcovr treats any counter at or above that as corruption from
# the gcov counter bug (GCC PR 68080) and aborts, so turn the check off. Note
# that ignoring instead of disabling would silently report those lines as
# uncovered, since ignored hits are recorded as zero.
gcov-suspicious-hits-threshold = 0

# Meson only passes its own subproject exclusion when this file is absent.
exclude = subprojects/
